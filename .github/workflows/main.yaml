name: Sort index.md by 30-day Activity

on:
  push:
    branches:
      - main
    paths:
      - index.md
      - inactive.md
      - streamers.csv
      - inactive_streamers.csv
      - "templates/**"
      - ".github/scripts/**"
  schedule:
    # 11:07 UTC; GitHub often starts scheduled runs late.
    - cron: "07 11 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

# One run at a time; queued runs coalesce (GitHub keeps only the latest pending).
# NEVER cancel in progress: a stream-event push must not kill the daily secinfo
# regen mid-scrape (scheduled runs are not retried).
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LANGUAGES: "ar de es fr hi it pt tr zh"
      # Pinned by digest so the committed output only changes when this line
      # does; bump it when releasing secinfo.
      SECINFO_IMAGE: ghcr.io/infosecstreams/secinfo@sha256:5739bdb43f74e064d06b4f1ea657b9b9da499eee4e9de5a9927108fef2843c46 # v0.1.9
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The tip of main, not the commit that triggered a run that may
          # have waited in the queue.
          ref: main

      - name: Regenerate, commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LANG_DIRS=$(for lang in $LANGUAGES; do echo -n "$lang/ "; done)

          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              # Someone (usually StreamStatus) pushed meanwhile: rebuild on
              # top of their commit instead of rebasing generated files.
              git fetch --quiet origin main
              git reset --hard origin/main
            fi

            # Scheduled and manual runs always re-apply the roster rule from
            # StreamStatus's stats.json. Pushes do only when the CSVs and
            # pages disagree on who is listed.
            FULL=true
            if [ "$EVENT_NAME" = "push" ]; then
              FULL=$(python3 .github/scripts/needs_full_regen.py)
            fi
            echo "Attempt $attempt, full regen: $FULL"
            .github/scripts/regen.sh "$FULL"

            if ! git status --porcelain -- index.md inactive.md streamers.csv inactive_streamers.csv $LANG_DIRS | grep -q .; then
              echo "No content changes; nothing to commit"
              exit 0
            fi
            git add streamers.csv inactive_streamers.csv index.md inactive.md $LANG_DIRS
            git commit --quiet -m "🤖 Updated and sorted markdown files"
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected on attempt $attempt"
          done
          echo "Failed to push after 3 attempts"
          exit 1
